---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2004}-ansible:latest
    privileged: true
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/containerd
    cgroupns_mode: host
    groups:
      - ${MOLECULE_DISTRO:-ubuntu2004}
provisioner:
  name: ansible
  options:
    diff: true
    skip-tags: molecule-notest
  inventory:
    group_vars:
      all: {}
      debian10:
        cache_valid_time: 0
      debian11:
        cache_valid_time: 0
      debian12:
        cache_valid_time: 0
        ansible_remote_tmp: /tmp
      ubuntu2204:
        ansible_remote_tmp: /tmp
      rockylinux8:
        ansible_remote_tmp: /tmp
        ansible_become_method: su
        ansible_python_interpreter: auto_legacy_silent
      rockylinux9:
        ansible_remote_tmp: /tmp
        ansible_become_method: su
        ansible_python_interpreter: auto_legacy_silent
      fedora38:
        ansible_remote_tmp: /tmp
        ansible_become_method: su
        ansible_python_interpreter: /usr/bin/python3
      fedora39:
        ansible_remote_tmp: /tmp
        ansible_become_method: su
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible
